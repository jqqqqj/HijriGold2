name: Build HijriGold APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q HijriGold-OneFile-Build.zip -d project
          echo "Project contents:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "GRADLEW=$GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HijriGold-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
